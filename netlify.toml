[build]
command = "pnpm install && pnpm run build"
functions = "dist/backend"
publish = "dist/frontend"

[build.environment]
URL_FFVB = "https://www.ffvbbeach.org/ffvbapp/resu/vbspo_calendrier.php"


[[redirects]]
from = "/api/*"
to = "/.netlify/functions/index/:splat"
status = 200
force = true

[dev]
command = "node dist/backend/server.js"
targetPort = 8080

